<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUM Technology</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: #101c2d;
      --card: #0d1727;
      --text: #eaf4ff;
      --muted: #a7bad1;
      --primary: #00d4ff;
      --secondary: #7c3aed;
      --accent: #51e79d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg), #0f1e2e 50%, #0d1422);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .wrap {
      width: min(900px, 90vw);
      background: rgba(16, 28, 45, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 40px 28px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0,212,255,0.12);
      color: var(--primary);
      border: 1px solid rgba(0,212,255,0.28);
      margin-bottom: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 12px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(2rem, 5vw, 4rem);
    }
    .gradient {
      color: var(--primary);
    }
    p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 24px;
    }
    .actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s ease;
    }
    a.btn:hover { transform: translateY(-1px); }
    .primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #04121d;
    }
    .secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.12);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">AUM Technology</div>
    <h1>Build smarter <span class="gradient">digital systems</span></h1>
    <p>
      We help businesses launch powerful websites, client portals, software systems,
      and modern digital experiences that scale with their growth.
    </p>
    <div class="actions">
      <a class="btn primary" href="case-studies.html">View Case Studies</a>
      <a class="btn secondary" href="../admin/login.html">Admin Login</a>
    </div>
  </div>
</body>
</html>
